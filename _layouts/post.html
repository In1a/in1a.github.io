---
layout: default
---
<article class="article">
  <a class="back" href="{{ '/' | relative_url }}">← 返回文章列表</a>
  <h1>{{ page.title | escape }}</h1>
  <div class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%Y 年 %m 月 %d 日' }}</time>{% if page.categories.size > 0 %} · {{ page.categories | join: ' / ' }}{% endif %}</div>
  <div class="post-body">{{ content }}</div>
  {% if page.source_url %}<p class="source">原文：<a href="{{ page.source_url }}" target="_blank" rel="noopener">博客园原始文章 ↗</a></p>{% endif %}
</article>
